<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Double Pendulum</title>
    <meta name="title" content="Double Pendulum" />
    <meta
      name="description"
      content="Interactive Double Pendulum Playground Using SVG"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://theabbie.github.io/DoublePendulum/"
    />
    <meta property="og:title" content="Double Pendulum" />
    <meta
      property="og:description"
      content="Interactive Double Pendulum Playground Using SVG"
    />
    <meta
      property="og:image"
      content="https://theabbie.github.io/DoublePendulum/DoublePendulum.jpg"
    />
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://theabbie.github.io/DoublePendulum/"
    />
    <meta property="twitter:title" content="Double Pendulum" />
    <meta
      property="twitter:description"
      content="Interactive Double Pendulum Playground Using SVG"
    />
    <meta
      property="twitter:image"
      content="https://theabbie.github.io/DoublePendulum/DoublePendulum.jpg"
    />
    <style>
      * {
        user-select: none;
      }
      body {
        margin: 0;
        background-color: #121212;
        overflow: hidden;
      }
      svg {
        width: 100%;
        height: 100%;
        background-color: transparent;
        touch-action: none;
      }
      line {
        stroke: white;
        stroke-width: 0.5;
        stroke-linecap: round;
        transition: 0s all;
      }
      circle {
        fill: white;
        stroke: 0;
        cursor: pointer;
      }
      path {
        stroke: white;
        stroke-width: 0.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #upper_graph {
        stroke: #212121;
      }
      input[type="checkbox"] {
        margin-right: 10px;
        transform: scale(1.5, 1.5);
      }
      
      /* New Menu Styles */
      .menu-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #333;
        z-index: 1000;
        transition: transform 0.3s ease;
      }
      
      .menu-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        min-height: 50px;
      }
      
      .menu-section {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      
      .menu-section.left {
        flex: 0 0 auto;
      }
      
      .menu-section.center {
        flex: 1 1 auto;
        justify-content: center;
      }
      
      .menu-section.right {
        flex: 0 0 auto;
      }
      
      .menu-button {
        background: none;
        border: none;
        color: #909090;
        font-family: "Courier New", Courier, monospace;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      
      .menu-button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .menu-button.active {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .menu-button.primary {
        background-color: #0066cc;
        color: white;
        padding: 8px 16px;
      }
      
      .menu-button.primary:hover {
        background-color: #0052a3;
      }
      
      #pause {
        font-size: 20px;
        padding: 8px 16px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
      }
      
      #pause:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .menu-dropdown {
        position: relative;
        display: inline-block;
      }
      
      .dropdown-content {
        position: absolute;
        top: 100%;
        left: 0;
        background-color: rgba(33, 33, 33, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid #444;
        border-radius: 4px;
        padding: 10px;
        margin-top: 5px;
        display: none;
        min-width: 200px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
      
      .dropdown-content.show {
        display: block;
      }
      
      .dropdown-section {
        margin-bottom: 15px;
      }
      
      .dropdown-section:last-child {
        margin-bottom: 0;
      }
      
      .dropdown-title {
        color: #666;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 5px;
        letter-spacing: 1px;
      }
      
      .dropdown-item {
        display: block;
        padding: 5px 10px;
        color: #909090;
        text-decoration: none;
        border-radius: 3px;
        transition: all 0.2s ease;
        cursor: pointer;
        font-size: 12px;
      }
      
      .dropdown-item:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .dropdown-item label {
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      
      .preset-group {
        display: flex;
        gap: 5px;
        margin: 5px 0;
      }
      
      .preset-button {
        padding: 5px 10px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid #444;
        border-radius: 3px;
        color: #909090;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
      }
      
      .preset-button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .preset-button.active {
        color: white;
        background-color: #0066cc;
        border-color: #0066cc;
      }
      
      .custom-input {
        width: 100%;
        padding: 5px;
        background-color: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 3px;
        font-family: "Courier New", Courier, monospace;
        font-size: 11px;
        margin-top: 5px;
      }
      
      .mass-control {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 5px 0;
      }
      
      .mass-control span {
        color: #909090;
        font-size: 12px;
      }
      
      .mass-control button {
        width: 24px;
        height: 24px;
        border: 1px solid #444;
        background-color: rgba(255, 255, 255, 0.1);
        color: #909090;
        border-radius: 3px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s ease;
      }
      
      .mass-control button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .save-load-buttons {
        display: flex;
        gap: 5px;
        margin: 5px 0;
      }
      
      .save-load-buttons button {
        flex: 1;
        padding: 5px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid #444;
        border-radius: 3px;
        color: #909090;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
      }
      
      .save-load-buttons button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      /* Mobile Menu Toggle */
      .mobile-menu-toggle {
        display: none;
        font-size: 24px;
        padding: 5px 10px;
        color: #909090;
        background: none;
        border: none;
        cursor: pointer;
      }
      
      @media only screen and (max-width: 768px) {
        .menu-main {
          padding: 10px;
        }
        
        .menu-section.center {
          display: none;
        }
        
        .menu-section.right {
          display: none;
        }
        
        .mobile-menu-toggle {
          display: block;
        }
        
        .menu-button {
          font-size: 12px;
          padding: 6px 10px;
        }
        
        #pause {
          font-size: 16px;
          padding: 6px 12px;
        }
        
        .dropdown-content {
          position: fixed;
          top: 60px;
          left: 10px;
          right: 10px;
          max-width: none;
        }
      }
      
      /* Keep existing styles for the rest of the elements */
      @media only screen and (min-width: 768px) {
        line {
          stroke-width: 0.3;
        }
        path {
          stroke-width: 0.1;
        }
      }

      #runtime-timer {
        position: fixed;
        bottom: 10px;
        left: 10px;
        font-size: 16pt;
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.1);
        color: #00ffcc;
        padding: 5px 10px;
        border-radius: 5px;
        font-family: monospace;
        z-index: 9999;
      }

      /* Styles for spin counters */
      .spin-counter { /* Common class for all spin counters */
        position: fixed;
        left: 10px;
        font-size: 16pt;
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 5px 10px;
        border-radius: 5px;
        font-family: monospace;
        z-index: 9999;
      }

      #lb-ccw-spins-counter {
        bottom: 70px; 
        color: #ffab00; /* Amber color for Lower Bob CCW spins */
      }

      #lb-cw-spins-counter {
        bottom: 100px; 
        color: #ff6f00; /* Orange color for Lower Bob CW spins */
      }

      #ub-ccw-spins-counter {
        bottom: 130px; 
        color: #00e676; /* Green color for Upper Bob CCW spins */
      }

      #ub-cw-spins-counter {
        bottom: 160px; 
        color: #00b0ff; /* Light Blue color for Upper Bob CW spins */
      }

      #ticks-counter {
          position: fixed;
          bottom: 40px; 
          left: 10px;
          font-size: 16pt;
          font-weight: bold;
          background-color: rgba(255, 255, 255, 0.1);
          color: #00ccff; 
          padding: 5px 10px;
          border-radius: 5px;
          font-family: monospace;
          z-index: 9999;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="container">
      <path id="upper_graph" />
      <circle id="base" />
      <line id="upper_string" />
      <circle id="upper_bob" />
      <line id="lower_string" />
      <circle id="lower_bob" />
      <path id="tracer" />
    </svg>
    
    <div class="menu-container" id="menuContainer">
      <div class="menu-main">
        <div class="menu-section left">
          <a href="/" class="menu-button">⌂</a>
          <button id="pause" class="menu-button">▶</button>
          <button onclick="loadConfig(1)" class="menu-button">RESET</button>
        </div>
        
        <div class="menu-section center">
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('simulationDropdown')">SIMULATION ▼</button>
            <div id="simulationDropdown" class="dropdown-content">
              <div class="dropdown-section">
                <div class="dropdown-title">Time Step (DT)</div>
                <div class="preset-group">
                  <button class="preset-button" onclick="setDTPreset(0.1, this)">Slow</button>
                  <button class="preset-button active" onclick="setDTPreset(0.5, this)">Normal</button>
                  <button class="preset-button" onclick="setDTPreset(1.5, this)">Fast</button>
                </div>
                <input type="number" class="custom-input" id="dtInput" placeholder="Custom (0.001-10.0)" step="0.01" min="0.01" max="10.0">
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-title">Error Threshold</div>
                <div class="preset-group">
                  <button class="preset-button" onclick="setErrorPreset(0.01, this)">Exact</button>
                  <button class="preset-button active" onclick="setErrorPreset(0.1, this)">Close</button>
                  <button class="preset-button" onclick="setErrorPreset(0.5, this)">Loose</button>
                </div>
                <input type="number" class="custom-input" id="errorPercentageInput" placeholder="Custom (0.0-1.0)" step="0.01" min="0" max="1">
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-item">
                  <label>
                    <input type="checkbox" id="pauseOnFindBox" onchange="pauseOnFindEnabled = this.checked; if (this.checked) loadSavedConfig2ForPause();">
                    Pause on Find 2
                  </label>
                </div>
              </div>
            </div>
          </div>
          
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('displayDropdown')">DISPLAY ▼</button>
            <div id="displayDropdown" class="dropdown-content">
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="showPendulumBox" onchange="togglePendulum(this.checked)">
                  Show Pendulum
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="resetbox" onchange="tracer.setActive(this.checked)">
                  Show Trace
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="graphbox" onchange="upperGraph.setActive(this.checked)">
                  Show Graph
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" id="persistbox" onchange="tracer.setMAX(this.checked ? 10000 : 500)">
                  Persist Trace
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" id="smoothenbox" onchange="tracer.smoothen=this.checked">
                  Smoothen Trace
                </label>
              </div>
            </div>
          </div>
          
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('physicsDropdown')">PHYSICS ▼</button>
            <div id="physicsDropdown" class="dropdown-content">
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="gravitybox" onchange="doublePendulum.setGravity(this.checked ? 0.1 : 0)">
                  Gravity
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="lockLengthBox" onchange="lockLengths = this.checked">
                  Lock Rope Lengths
                </label>
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-title">Mass Controls</div>
                <div class="mass-control">
                  <button onclick="doublePendulum.decreaseUpperMass()">-</button>
                  <span>Upper Mass</span>
                  <button onclick="doublePendulum.increaseUpperMass()">+</button>
                </div>
                <div class="mass-control">
                  <button onclick="doublePendulum.decreaseLowerMass()">-</button>
                  <span>Lower Mass</span>
                  <button onclick="doublePendulum.increaseLowerMass()">+</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="menu-section right">
          <button onclick="shareConfig()" class="menu-button">SHARE</button>
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('saveDropdown')">SAVE/LOAD ▼</button>
            <div id="saveDropdown" class="dropdown-content">
              <div class="dropdown-section">
                <div class="dropdown-title">Slot 1</div>
                <div class="save-load-buttons">
                  <button onclick="saveConfig(1)">💾 Save</button>
                  <button onclick="loadConfig(1)">📂 Load</button>
                </div>
              </div>
              <div class="dropdown-section">
                <div class="dropdown-title">Slot 2</div>
                <div class="save-load-buttons">
                  <button onclick="saveConfig(2)">💾 Save</button>
                  <button onclick="loadConfig(2)">📂 Load</button>
                </div>
              </div>
            </div>
          </div>
          <a href="https://github.com/theabbie/DoublePendulum" class="menu-button">GITHUB</a>
        </div>
        
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>
    
    <div id="runtime-timer">00hrs, 00min, 00sec 0mill</div>
    <div id="lb-ccw-spins-counter" class="spin-counter">LB CCW: 0</div>
    <div id="lb-cw-spins-counter" class="spin-counter">LB CW: 0</div>
    <div id="ub-ccw-spins-counter" class="spin-counter">UB CCW: 0</div>
    <div id="ub-cw-spins-counter" class="spin-counter">UB CW: 0</div>
    <div id="ticks-counter">Ticks: 0</div>
  </body>
  <script>
    // Menu functionality
    function toggleDropdown(dropdownId) {
      const dropdown = document.getElementById(dropdownId);
      const allDropdowns = document.querySelectorAll('.dropdown-content');
      
      allDropdowns.forEach(d => {
        if (d !== dropdown) {
          d.classList.remove('show');
        }
      });
      
      dropdown.classList.toggle('show');
    }
    
    function toggleMobileMenu() {
      const centerSection = document.querySelector('.menu-section.center');
      const rightSection = document.querySelector('.menu-section.right');
      
      if (centerSection.style.display === 'none' || !centerSection.style.display) {
        centerSection.style.display = 'flex';
        rightSection.style.display = 'flex';
      } else {
        centerSection.style.display = 'none';
        rightSection.style.display = 'none';
      }
    }
    
    // Close dropdowns when clicking outside
    window.addEventListener('click', function(e) {
      if (!e.target.matches('.menu-button') && !e.target.closest('.dropdown-content')) {
        const dropdowns = document.querySelectorAll('.dropdown-content');
        dropdowns.forEach(d => d.classList.remove('show'));
      }
    });
    
    // DT Preset handlers
    function setDTPreset(value, button) {
      // Remove active class from all preset buttons in this group
      button.parentElement.querySelectorAll('.preset-button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      
      // Set the value
      doublePendulum.dt = value;
      document.getElementById('dtInput').value = value.toFixed(5);
    }
    
    // Error Preset handlers
    function setErrorPreset(value, button) {
      // Remove active class from all preset buttons in this group
      button.parentElement.querySelectorAll('.preset-button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      
      // Set the value
      acceptableErrorPercentage = value;
      document.getElementById('errorPercentageInput').value = value.toFixed(3);
    }
    
    // Constants
    const PLAY_SYMBOL = "▶";
    const PAUSE_SYMBOL = "| |";
    const BOB_CLICK_RADIUS_MULTIPLIER = 2.25;
    const TIMER_UPDATE_INTERVAL = 100; // Update less frequently
    const GRAPH_SMOOTH_FACTOR = 0.2;
    const TRACE_DEFAULT_MAX = 500;
    const TRACE_PERSIST_MAX = 10000;
    
    // Cached DOM elements
    const shareButton = document.querySelector("#share");
    const gravityButton = document.querySelector("#gravitybox");
    const animationToggleButton = document.querySelector("#pause");
    const canvas = document.querySelector("#container");
    const upperGraphLine = document.querySelector("#upper_graph");
    const base = document.querySelector("#base");
    const upperString = document.querySelector("#upper_string");
    const lowerString = document.querySelector("#lower_string");
    const upperBob = document.querySelector("#upper_bob");
    const lowerBob = document.querySelector("#lower_bob");
    const tracerLine = document.querySelector("#tracer");
    // const pauseOnReturnCheckbox = document.getElementById("pauseOnReturnBox"); // Not used in current version
    const ticksCounter = document.getElementById("ticks-counter"); 
    const runtimeTimer = document.getElementById("runtime-timer");
    // Lower Bob spin counters
    const lbCwSpinsCounter = document.getElementById("lb-cw-spins-counter"); 
    const lbCcwSpinsCounter = document.getElementById("lb-ccw-spins-counter");
    // Upper Bob spin counters
    const ubCwSpinsCounter = document.getElementById("ub-cw-spins-counter");
    const ubCcwSpinsCounter = document.getElementById("ub-ccw-spins-counter");
 
    // New input element references
    const dtInput = document.getElementById("dtInput");
    const errorPercentageInput = document.getElementById("errorPercentageInput");

    // Lower Bob spin tracking variables
    let lb_cw_spins = 0; 
    let lb_ccw_spins = 0; 
    let previous_lb_abs_angle = 0; 
    let accumulated_lb_abs_angle_change = 0;

    // Upper Bob spin tracking variables
    let ub_cw_spins = 0;
    let ub_ccw_spins = 0;
    let previous_ub_abs_angle = 0;
    let accumulated_ub_abs_angle_change = 0;

    let totalTicks = 0; 
    let animation;
    let lockLengths = true;
    let pauseOnFindEnabled = false; // For "Pause on Find 2" checkbox
    let initialPendulumState = null; 
    let acceptableErrorPercentage = 0.01;
    let startTime = Date.now();
    let pausedTime = 0;
    let pauseStart = Date.now();
    let timerInterval = null; 

    class DoublePendulum {
      constructor({
        width,
        height,
        x0,
        y0,
        ang0,
        ang1,
        v0,
        v1,
        acc0,
        acc1,
        baseRad,
        l0,
        l1,
        r0,
        r1,
        m0,
        m1,
        g,
        massScaleFactor,
        speedScaleFactor,
        dt, 
        fps,
      }) {
        this.width = width;
        this.height = height;
        this.x0 = x0;
        this.y0 = y0;
        this.ang0 = ang0; // Angle of upper pendulum relative to vertical
        this.ang1 = ang1; // Angle of lower pendulum relative to upper pendulum
        this.v0 = v0;
        this.v1 = v1;
        this.acc0 = acc0;
        this.acc1 = acc1;
        this.baseRad = baseRad;
        this.l0 = l0;
        this.l1 = l1;
        this.r0 = r0;
        this.r1 = r1;
        this.m0 = m0;
        this.m1 = m1;
        this.g = g;
        this.upperBobHold = false;
        this.lowerBobHold = false;
        this.baseHold = false;
        this.massScaleFactor = massScaleFactor;
        this.speedScaleFactor = speedScaleFactor;
        this.dt = dt; 
        this.fps = fps;
        this.setMoments();
      }

      setWidth(w) {
        this.width = w;
      }

      setHeight(h) {
        this.height = h;
      }

      setUpperAngle(ang) {
        this.ang0 = ang;
      }

      setLowerAngle(ang) {
        this.ang1 = ang;
      }

      setUpperVelocity(vel) {
        this.v0 = vel;
      }

      setLowerVelocity(vel) {
        this.v1 = vel;
      }

      setUpperAcceleration(acc) {
        this.acc0 = acc;
      }

      setLowerAcceleration(acc) {
        this.acc1 = acc;
      }

      increaseSpeed() {
        this.dt *= this.speedScaleFactor;
        const dtInputField = document.getElementById('dtInput');
        if (dtInputField) {
            dtInputField.value = this.dt.toFixed(5); 
        }
      }

      decreaseSpeed() {
        this.dt /= this.speedScaleFactor;
        const dtInputField = document.getElementById('dtInput');
        if (dtInputField) {
            dtInputField.value = this.dt.toFixed(5);
        }
      }

      increaseUpperMass() {
        this.m0 *= this.massScaleFactor;
      }

      decreaseUpperMass() {
        this.m0 /= this.massScaleFactor;
      }

      increaseLowerMass() {
        this.m1 *= this.massScaleFactor;
      }

      decreaseLowerMass() {
        this.m1 /= this.massScaleFactor;
      }

      setGravity(gravity) {
        this.g = gravity;
      }

      setMoments() {
        const { m0, m1, ang0, ang1, l0, l1, v0, v1 } = this;
        const commonVal = m1 * l0 * l1 * Math.cos(ang0 - ang1);
        this.moment0 = (m0 + m1) * l0 ** 2 * v0 + v1 * commonVal;

        );
        const k3 = this.hamiltonian(
          ...curr.map((_c, _i) => _c + 0.5 * dt * k2[_i])
        );

        this.ang1 += R[1]; // This updates ang1_abs
        this.moment0 += R[2];
        this.moment1 += R[3];

        this.ang0 = ((3 * Math.PI + this.ang0) % (2 * Math.PI)) - Math.PI; // to -PI to PI

    class Tracer {
      constructor() {
        this.points = [];
        this.MAX = TRACE_DEFAULT_MAX;
        this.isActive = true;
        this.ctr = 0;
        this.smooth = GRAPH_SMOOTH_FACTOR;
        this.smoothen = false;
      }

      addPoint({ x, y }) {
        if (this.isActive)
          this.points = [...this.points.slice(-this.MAX), { x, y }];
        else this.points = [];
      }

      addGraphPoint(data) {
        if (this.isActive)
          this.points = [...this.points, { x: this.ctr++, y: data }];
        else this.points = [];
      }

      clearPoints() {
        this.points = [];
        this.ctr = 0;
      }

      getLine(p1, p2) {
        const distX = p2.x - p1.x;
        const distY = p2.y - p1.y;
        const len = Math.sqrt(distX ** 2 + distY ** 2);
        const ang = Math.atan2(distY, distX);
        return { len, ang };
      }

      getControlPoint(current, previous, next, reverse) {
        previous = previous || current;
        next = next || current;
        let { len, ang } = this.getLine(previous, next);
        ang = ang + (reverse ? Math.PI : 0);
        len = len * this.smooth;
        const x = current.x + len * Math.cos(ang);
        const y = current.y + len * Math.sin(ang);
        return { x, y };
      }

      getSmoothPoint(point, i, points) {
        const prevSmooth = this.getControlPoint(
          points[i - 1],
          points[i - 2],
          point
        );
        const nextSmooth = this.getControlPoint(
          point,
          points[i - 1],
          points[i + 1]
        );
        return `C${prevSmooth.x.toFixed(2)} ${prevSmooth.y.toFixed(
          2
        )} ${nextSmooth.x.toFixed(2)} ${nextSmooth.y.toFixed(
          2
        )} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`;
      }

      getPointsAsString() {
        if (this.points.length === 0) return "";
        if (this.smoothen) {
          return this.points
            .map(
              ({ x, y }, i) =>
                `${
                  i == 0
                    ? `M${x.toFixed(2)} ${y.toFixed(2)}`
                    : this.getSmoothPoint({ x, y }, i, this.points)
                }`
            )
            .join(" ");
        } else {
          return this.points
            .map(
              ({ x, y }, i) =>
                `${i == 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`
            )
            .join(" ");
        }
      }

      setActive(active) {
        this.isActive = active;
      }

      setMAX(n) {
        this.MAX = n;
      }
    }

    let doublePendulum;
    const tracer = new Tracer();
    const upperGraph = new Tracer();

    function resetAllSpinCounters() {
        // Lower bob
        lb_cw_spins = 0;
        lb_ccw_spins = 0;
        accumulated_lb_abs_angle_change = 0;
        lbCwSpinsCounter.textContent = `LB CW: ${lb_cw_spins}`;
        lbCcwSpinsCounter.textContent = `LB CCW: ${lb_ccw_spins}`;

        // Upper bob
        ub_cw_spins = 0;
        ub_ccw_spins = 0;
        accumulated_ub_abs_angle_change = 0;
        ubCwSpinsCounter.textContent = `UB CW: ${ub_cw_spins}`;
        ubCcwSpinsCounter.textContent = `UB CCW: ${ub_ccw_spins}`;

        // Initialize previous angles after pendulum is created/reset
        if (doublePendulum) {
            const initial_lb_pos = doublePendulum.getLowerBob();
            previous_lb_abs_angle = Math.atan2(initial_lb_pos.y - doublePendulum.y0, initial_lb_pos.x - doublePendulum.x0);
            
            const initial_ub_pos = doublePendulum.getUpperBob();
            previous_ub_abs_angle = Math.atan2(initial_ub_pos.y - doublePendulum.y0, initial_ub_pos.x - doublePendulum.x0);
        }
    }


    function refresh() {
      totalTicks = 0; 
      ticksCounter.innerText = `Ticks: ${totalTicks}`;
      const scaleWidth = 100;
      const scaleHeight = (100 * innerHeight) / innerWidth;
      const scale = Math.min(scaleWidth, scaleHeight);
      
      let initialDt = parseFloat(dtInput.value);
      if (isNaN(initialDt) || initialDt <= 0) {
        initialDt = 0.1; // Default dt
      }

      doublePendulum = new DoublePendulum({
        width: scaleWidth,
        height: scaleHeight,
        x0: scaleWidth / 2,
        y0: scaleHeight / 2,
        ang0: Math.PI / 2, // Start horizontal for testing
        ang1: Math.PI / 2, // Start horizontal for testing (absolute angle)
        v0: 0,
        v1: 0,
        acc0: 0,
        acc1: 0,
        baseRad: scale / 70,
        l0: scale / 4.5,
        l1: scale / 4.5,
        r0: scale / 30,
        r1: scale / 30,
        m0: 100,
        m1: 100,
        g: 0.1,
        massScaleFactor: 1.2,
        speedScaleFactor: 1.2,
        dt: initialDt, 
        fps: 100,
      });

      if (window.location.hash.length > 0) {
        const query = window.location.hash.substring(1);
        try {
          const encoded_JSON = atob(query);
          const config = JSON.parse(encoded_JSON);
          for (let prop in config) {
            if (doublePendulum.hasOwnProperty(prop)) {
                 doublePendulum[prop] = config[prop];
            }
          }
          if (config.hasOwnProperty('acceptableErrorPercentage')) {
            acceptableErrorPercentage = config.acceptableErrorPercentage;
          }

          doublePendulum.width = scaleWidth; 
          doublePendulum.height = scaleHeight;
          const loadedConfigWidth = config.width || scaleWidth;
          const loadedConfigHeight = config.height || scaleHeight;
          doublePendulum.x0 = (config.x0 / loadedConfigWidth) * scaleWidth;
          doublePendulum.y0 = (config.y0 / loadedConfigHeight) * scaleHeight;

        } catch (e) {
          console.error("Error parsing hash config:", e);
          window.location.hash = ""; 
        }
      }

      canvas.setAttribute(
        "viewBox",
        `0 0 ${doublePendulum.width} ${doublePendulum.height}`
      );
      gravityButton.checked = doublePendulum.g != 0;
      
      dtInput.value = doublePendulum.dt.toFixed(5);
      errorPercentageInput.value = acceptableErrorPercentage.toFixed(3);

      tracer.clearPoints();
      upperGraph.clearPoints();
      resetAllSpinCounters(); // Reset and initialize spin counters and previous angles
      drawPendulum(); 
    }


    function drawPendulum() {
      if (!doublePendulum) return; 
      const { x0, y0, baseRad, r0, r1 } = doublePendulum; // ang0, ang1, l0, l1 removed as getUpper/LowerBob use them

      const upperBobPos = doublePendulum.getUpperBob();
      const lowerBobPos = doublePendulum.getLowerBob();

      base.setAttribute("r", baseRad);
      base.setAttribute("cx", x0);
      base.setAttribute("cy", y0);

      upperString.setAttribute("x1", x0);
      upperString.setAttribute("y1", y0);
      upperString.setAttribute("x2", upperBobPos.x);
      upperString.setAttribute("y2", upperBobPos.y);

      upperBob.setAttribute("r", r0);
      upperBob.setAttribute("cx", upperBobPos.x);
      upperBob.setAttribute("cy", upperBobPos.y);

      lowerString.setAttribute("x1", upperBobPos.x);
      lowerString.setAttribute("y1", upperBobPos.y);
      lowerString.setAttribute("x2", lowerBobPos.x);
      lowerString.setAttribute("y2", lowerBobPos.y);

      lowerBob.setAttribute("r", r1);
      lowerBob.setAttribute("cx", lowerBobPos.x);
      lowerBob.setAttribute("cy", lowerBobPos.y);

      // Graphing based on relative angle for visual interest, assuming ang1 is relative for this part
      // If ang1 is absolute, this needs to be ang1 - ang0
      const relativeAngleForGraph = doublePendulum.ang1; // If this.ang1 is already relative
      // If this.ang1 is absolute, then: const relativeAngleForGraph = doublePendulum.ang1 - doublePendulum.ang0;
      const tempAng = doublePendulum.ang0 + relativeAngleForGraph; // This was original logic, implies ang1 was relative for graph
      const tempPlot = Math.min(tempAng, 2 * Math.PI - tempAng); // This seems to be for phase space plot, not directly relevant to spin

      upperGraph.addGraphPoint(
        doublePendulum.height * 0.5 +
          (doublePendulum.height * 0.125 * tempPlot) / Math.PI
      );
      drawGraph();
    }

    function drawTracer() {
      tracerLine.setAttribute("d", tracer.getPointsAsString());
    }

    function drawGraph() {
      if (upperGraph.points.length > 0) {
        upperGraphLine.style.transform = `translateX(-${ Math.max(0, upperGraphLine.getBBox().width - doublePendulum.width)}px)`;
      }
      upperGraphLine.setAttribute("d", upperGraph.getPointsAsString());
    }

    function getDistance(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function checkPauseOnFind() { // Renamed from checkPauseOnReturn
      if (!pauseOnFindEnabled || !initialPendulumState) {
        return; 
      }

      const currentUpperBobPos = doublePendulum.getUpperBob();
      const currentLowerBobPos = doublePendulum.getLowerBob();
      
      const tempPendulum = new DoublePendulum({
        ...initialPendulumState,
        width: doublePendulum.width,
        height: doublePendulum.height
      });
      
      const initialUpperBobPos = tempPendulum.getUpperBob();
      const initialLowerBobPos = tempPendulum.getLowerBob();

      const errorThreshold = doublePendulum.l0 * acceptableErrorPercentage;

      const distUpper = getDistance(currentUpperBobPos, initialUpperBobPos);
      const distLower = getDistance(currentLowerBobPos, initialLowerBobPos);

      if (distUpper <= errorThreshold && distLower <= errorThreshold && totalTicks > 10) { // Added tick threshold
        if (animation) { 
            animationToggle();
        }
      }
    }
    
    function loadSavedConfig2ForPause() {
        if (document.getElementById('pauseOnFindBox').checked) {
            // Try to load config from slot 2 if "Pause on Find 2" is checked
            const configStr = localStorage.getItem(`pendulumSave2`);
            if (configStr) {
                try {
                    const loadedFullConfig = JSON.parse(configStr);
                    let savedPendulumData;
                    if (loadedFullConfig.pendulumState) {
                        savedPendulumData = loadedFullConfig.pendulumState;
                    } else {
                        savedPendulumData = loadedFullConfig;
                    }
                    initialPendulumState = { ...savedPendulumData }; // Store this as the target state
                    console.log("Loaded target state for 'Pause on Find 2' from slot 2.");
                } catch (e) {
                    console.error("Failed to load target state from slot 2:", e);
                    initialPendulumState = null;
                }
            } else {
                console.warn("'Pause on Find 2' checked, but no configuration found in slot 2 to use as target.");
                initialPendulumState = null; // Ensure it's null if slot 2 is empty
            }
        } else {
            initialPendulumState = null; // Clear if checkbox is unchecked
        }
    }


    function animate() {
      if (!doublePendulum) return;
      doublePendulum.move();

      // --- Spin Counting for Lower Bob ---
      const current_lb_pos = doublePendulum.getLowerBob();
      let current_absolute_angle_lb = Math.atan2(current_lb_pos.y - doublePendulum.y0, current_lb_pos.x - doublePendulum.x0);
      let delta_abs_lb = current_absolute_angle_lb - previous_lb_abs_angle;
      let shortest_delta_abs_lb = Math.atan2(Math.sin(delta_abs_lb), Math.cos(delta_abs_lb));
      accumulated_lb_abs_angle_change += shortest_delta_abs_lb;

      if (accumulated_lb_abs_angle_change >= 2 * Math.PI) {
        lb_ccw_spins++; 
        accumulated_lb_abs_angle_change -= 2 * Math.PI;
        lbCcwSpinsCounter.textContent = `LB CCW: ${lb_ccw_spins}`;
      } else if (accumulated_lb_abs_angle_change <= -2 * Math.PI) {
        lb_cw_spins++; 
        accumulated_lb_abs_angle_change += 2 * Math.PI;
        lbCwSpinsCounter.textContent = `LB CW: ${lb_cw_spins}`;
      }
      previous_lb_abs_angle = current_absolute_angle_lb;

      // --- Spin Counting for Upper Bob ---
      const current_ub_pos = doublePendulum.getUpperBob();
      // The angle of the upper bob is simply its `ang0` if `ang0` is defined from the pivot (x0,y0)
      // and atan2 uses (y-y_pivot, x-x_pivot).
      // `doublePendulum.ang0` is angle from +Y axis, clockwise.
      // `atan2(y,x)` gives angle from +X axis, counter-clockwise.
      // To use atan2(y-pivot, x-pivot) for angle from +X CCW:
      let current_absolute_angle_ub = Math.atan2(current_ub_pos.y - doublePendulum.y0, current_ub_pos.x - doublePendulum.x0);

      let delta_abs_ub = current_absolute_angle_ub - previous_ub_abs_angle;
      let shortest_delta_abs_ub = Math.atan2(Math.sin(delta_abs_ub), Math.cos(delta_abs_ub));
      accumulated_ub_abs_angle_change += shortest_delta_abs_ub;

      if (accumulated_ub_abs_angle_change >= 2 * Math.PI) {
        ub_ccw_spins++;
        accumulated_ub_abs_angle_change -= 2 * Math.PI;
        ubCcwSpinsCounter.textContent = `UB CCW: ${ub_ccw_spins}`;
      } else if (accumulated_ub_abs_angle_change <= -2 * Math.PI) {
        ub_cw_spins++;
        accumulated_ub_abs_angle_change += 2 * Math.PI;
        ubCwSpinsCounter.textContent = `UB CW: ${ub_cw_spins}`;
      }
      previous_ub_abs_angle = current_absolute_angle_ub;


      drawPendulum();
      tracer.addPoint(current_lb_pos); 
      drawTracer();
      checkPauseOnFind(); 
      totalTicks++; 
      ticksCounter.textContent = `Ticks: ${totalTicks}`; 
    }
    
    function animationToggle(e) {
      if (!animation) {
        const currentDtFromInput = parseFloat(dtInput.value);
        if (!isNaN(currentDtFromInput) && currentDtFromInput > 0) {
            doublePendulum.dt = currentDtFromInput;
        } else {
            dtInput.value = doublePendulum.dt.toFixed(5); 
        }
        
        // If "Pause on Find 2" is enabled, load target state from slot 2
        // This is now handled by the checkbox's onchange event.
        // if (pauseOnFindEnabled && !initialPendulumState) { 
        //    loadSavedConfig2ForPause(); // Load if not already loaded
        // }


        // Reset spin counts and tracking only if starting from tick 0
        if (totalTicks === 0) {
            resetAllSpinCounters(); // This also sets previous angles
        }

        animation = setInterval(animate, 1000 / doublePendulum.fps);
        animationToggleButton.innerHTML = PAUSE_SYMBOL;
        if (pauseStart !== null) {
          pausedTime += Date.now() - pauseStart;
          pauseStart = null;
        }
      } else {
        clearInterval(animation);
        animation = null;
        animationToggleButton.innerHTML = PLAY_SYMBOL;
        pauseStart = Date.now();
      }
    }

    function togglePendulum(show) {
      const displayValue = show ? "block" : "none";
      base.style.display = displayValue;
      upperString.style.display = displayValue;
      upperBob.style.display = displayValue;
      lowerString.style.display = displayValue;
      lowerBob.style.display = displayValue;
    }

    function shareConfig() {
      // Create a minimal config for sharing, excluding potentially large internal state if not needed
      const shareableConfig = {
        x0: doublePendulum.x0,
        y0: doublePendulum.y0,
        ang0: doublePendulum.ang0,
        ang1: doublePendulum.ang1, // If ang1 is absolute, this is fine. If relative, also fine.
        l0: doublePendulum.l0,
        l1: doublePendulum.l1,
        r0: doublePendulum.r0,
        r1: doublePendulum.r1,
        m0: doublePendulum.m0,
        m1: doublePendulum.m1,
        g: doublePendulum.g,
        dt: doublePendulum.dt,
        // Include moments if they are essential for restoring exact state from hash
        moment0: doublePendulum.moment0,
        moment1: doublePendulum.moment1,
        // width and height are for scaling, not part of the core physics state to share usually
        acceptableErrorPercentage: acceptableErrorPercentage 
      };
      window.location.hash = btoa(JSON.stringify(shareableConfig));
      const originalText = shareButton.textContent;
      shareButton.textContent = "👆 COPY LINK !!!";
      setTimeout(() => (shareButton.textContent = originalText), 1500);
    }

    function saveConfig(slot) {
      const fullConfig = {
        pendulumState: { ...doublePendulum }, 
        errorPercentage: acceptableErrorPercentage 
      };
      const config = JSON.stringify(fullConfig);
      localStorage.setItem(`pendulumSave${slot}`, config);
       // If saving to slot 2 and "Pause on Find 2" is checked, update initialPendulumState
      if (slot === 2 && pauseOnFindEnabled) {
        initialPendulumState = { ...doublePendulum }; // Save current state as target
        console.log("Updated target state for 'Pause on Find 2' from current state (saved to slot 2).");
      }
    }

    function loadConfig(slot) {
      totalTicks = 0; 
      ticksCounter.textContent = `Ticks: ${totalTicks}`;
      // initialPendulumState = null; // Clear general initial state, "Pause on Find" handles its own
      
      let configStr = localStorage.getItem(`pendulumSave${slot}`);
      
      if (!configStr && slot === 1) { 
        refresh(); 
        return;
      }
      if (!configStr) {
        return;
      }

      try {
        const loadedFullConfig = JSON.parse(configStr);
        let savedPendulumData;

        if (loadedFullConfig.pendulumState) { 
          savedPendulumData = loadedFullConfig.pendulumState;
          if (loadedFullConfig.hasOwnProperty('errorPercentage')) {
            acceptableErrorPercentage = loadedFullConfig.errorPercentage;
          } else {
            acceptableErrorPercentage = 0.01; 
          }
        } else { 
          savedPendulumData = loadedFullConfig;
          acceptableErrorPercentage = 0.01; 
        }
        
        for (let prop in savedPendulumData) {
          if (doublePendulum.hasOwnProperty(prop)) {
            doublePendulum[prop] = savedPendulumData[prop];
          }
        }

        const scaleWidth = 100;
        const scaleHeight = (100 * innerHeight) / innerWidth;
        doublePendulum.width = scaleWidth;
        doublePendulum.height = scaleHeight;
        const loadedConfigWidth = savedPendulumData.width || scaleWidth;
        const loadedConfigHeight = savedPendulumData.height || scaleHeight;
        doublePendulum.x0 = (savedPendulumData.x0 / loadedConfigWidth) * scaleWidth;
        doublePendulum.y0 = (savedPendulumData.y0 / loadedConfigHeight) * scaleHeight;

        canvas.setAttribute(
          "viewBox",
          `0 0 ${doublePendulum.width} ${doublePendulum.height}`
        );
        
        dtInput.value = doublePendulum.dt.toFixed(5);
        errorPercentageInput.value = acceptableErrorPercentage.toFixed(3);
        gravityButton.checked = doublePendulum.g !== 0;

        tracer.clearPoints();
        upperGraph.clearPoints();
        resetAllSpinCounters(); // Reset and initialize spin counters

      } catch (e) {
        console.error("Failed to load configuration from slot " + slot + ":", e);
        if (slot === 1) refresh(); 
      }

      startTime = Date.now();
      pausedTime = 0;
      pauseStart = Date.now(); 
      if (animation) {
        clearInterval(animation);
        animation = null;
      }
      animationToggleButton.innerHTML = PLAY_SYMBOL;
      drawPendulum();

      // If loading slot 2 and "Pause on Find 2" is checked, this becomes the new target state.
      if (slot === 2 && pauseOnFindEnabled) {
        initialPendulumState = { ...doublePendulum };
        console.log("Set target state for 'Pause on Find 2' from loaded slot 2.");
      } else if (slot !== 2 && pauseOnFindEnabled) {
        // If another slot was loaded, but pauseOnFind is active, we might need to re-evaluate
        // or prompt user, or just keep the previously set initialPendulumState from slot 2.
        // For now, let's assume initialPendulumState is only set by loading slot 2 or saving to slot 2 when active.
      } else if (!pauseOnFindEnabled) {
        initialPendulumState = null; // Clear if not relevant
      }
    }

    function handleHold(clickX, clickY) {
      const { x0, y0, baseRad, r0, r1 } = doublePendulum;
      const upperBobPos = doublePendulum.getUpperBob();
      const lowerBobPos = doublePendulum.getLowerBob();
      
      const baseRadSq = BOB_CLICK_RADIUS_MULTIPLIER * baseRad * baseRad; // Use squared radius for efficiency
      const upperBobRadSq = BOB_CLICK_RADIUS_MULTIPLIER * r0 * r0;
      const lowerBobRadSq = BOB_CLICK_RADIUS_MULTIPLIER * r1 * r1;
      
      let isNowHolding = false;

      if ((clickX - x0) ** 2 + (clickY - y0) ** 2 < baseRadSq) { 
        if (animation) animationToggle(); // Pause before holding
        tracer.clearPoints();
        doublePendulum.holdBase();
        isNowHolding = true;
      } else if ((clickX - upperBobPos.x) ** 2 + (clickY - upperBobPos.y) ** 2 < upperBobRadSq ) {
        if (animation) animationToggle(); 
        tracer.clearPoints();
        doublePendulum.holdUpperBob();
        isNowHolding = true;
      } else if ((clickX - lowerBobPos.x) ** 2 + (clickY - lowerBobPos.y) ** 2 < lowerBobRadSq ) {
        if (animation) animationToggle(); 
        tracer.clearPoints();
        doublePendulum.holdLowerBob();
        isNowHolding = true;
      }

      if (isNowHolding) {
        totalTicks = 0; 
        ticksCounter.textContent = `Ticks: ${totalTicks}`;
        // initialPendulumState = null; // Clear for "Pause on Find" if dragging
        if (pauseOnFindEnabled) {
            // If dragging, the "find" state is invalidated.
            // User might want to set a new "find" state after positioning.
            // For now, let's clear it.
            initialPendulumState = null; 
            console.log("Pendulum dragged, 'Pause on Find 2' target state cleared.");
        }
        resetAllSpinCounters(); // Reset spins when holding starts
      }
    }

    function handleMove(clickX, clickY) {
      if (doublePendulum.baseHold || doublePendulum.upperBobHold || doublePendulum.lowerBobHold) {
        if (doublePendulum.baseHold) {
            doublePendulum.setBasePos(clickX, clickY);
        }
        if (doublePendulum.upperBobHold) {
            doublePendulum.setUpperBobPos(clickX, clickY);
        }
        if (doublePendulum.lowerBobHold) {
            doublePendulum.setLowerBobPos(clickX, clickY);
        }
        // When dragging, reset moments/velocities to prevent wild swinging on release
        doublePendulum.v0 = 0;
        doublePendulum.v1 = 0;
        doublePendulum.moment0 = 0; // Or recalculate based on new angles if desired
        doublePendulum.moment1 = 0; // Or recalculate
        // doublePendulum.setMoments(); // This might be better if v0,v1 are meant to be derived

        resetAllSpinCounters(); // Continuously update previous angles while dragging
        drawPendulum(); 
      }
    }

    function handleDrop() {
      if (!animation && (doublePendulum.upperBobHold || doublePendulum.lowerBobHold || doublePendulum.baseHold )) {
         if(pauseStart === null) pauseStart = Date.now();
      }

      // Before dropping, if a bob was held, ensure its velocity and momentum are zeroed
      // or recalculated if that's the desired behavior.
      // The `handleMove` already zeroes them.
      // doublePendulum.setMoments(); // Recalculate moments based on current (potentially zero) velocities

      doublePendulum.dropUpperBob();
      doublePendulum.dropLowerBob();
      doublePendulum.dropBase();
    }

    dtInput.addEventListener('input', function() {
        const newDt = parseFloat(this.value);
        if (!isNaN(newDt) && newDt > 0 && newDt <=10) { // Max value check
            if(doublePendulum) doublePendulum.dt = newDt;
            document.querySelectorAll('.preset-button').forEach(b => {
              if (b.onclick && b.onclick.toString().includes('setDTPreset')) {
                b.classList.remove('active');
              }
            });
        } else if (newDt > 10) { // Correct if over max
            this.value = "10.0";
            if(doublePendulum) doublePendulum.dt = 10.0;
        }
    });

    errorPercentageInput.addEventListener('input', function() {
        const newErrorPercentage = parseFloat(this.value);
        if (!isNaN(newErrorPercentage) && newErrorPercentage >= 0 && newErrorPercentage <= 1) { 
            acceptableErrorPercentage = newErrorPercentage;
            document.querySelectorAll('.preset-button').forEach(b => {
              if (b.onclick && b.onclick.toString().includes('setErrorPreset')) {
                b.classList.remove('active');
              }
            });
        }
    });


    window.addEventListener("mousedown", (e) => {
      // Prevent interaction if click is on menu or dropdowns
      if (e.target.closest('.menu-container') || e.target.closest('.dropdown-content')) return;
      const clickX = (e.clientX * doublePendulum.width) / canvas.clientWidth;
      const clickY = (e.clientY * doublePendulum.height) / canvas.clientHeight;
      handleHold(clickX, clickY);
    });

    window.addEventListener("touchstart", (e) => {
      if (e.target.closest('.menu-container') || e.target.closest('.dropdown-content')) return;
      if (e.target === canvas || e.target.closest("svg")) { 
        const clickX =
            (e.touches[0].clientX * doublePendulum.width) / canvas.clientWidth;
        const clickY =
            (e.touches[0].clientY * doublePendulum.height) / canvas.clientHeight;
        handleHold(clickX, clickY);
      }
    });

    window.addEventListener("mousemove", (e) => {
      if(doublePendulum.baseHold || doublePendulum.upperBobHold || doublePendulum.lowerBobHold) { 
        const clickX = (e.clientX * doublePendulum.width) / canvas.clientWidth;
        const clickY = (e.clientY * doublePendulum.height) / canvas.clientHeight;
        handleMove(clickX, clickY);
      }
    });

    window.addEventListener("touchmove", (e) => {
      if (doublePendulum.baseHold || doublePendulum.upperBobHold || doublePendulum.lowerBobHold) { 
        if (e.target === canvas || e.target.closest("svg")) {
            e.preventDefault(); 
            const clickX =
                (e.touches[0].clientX * doublePendulum.width) / canvas.clientWidth;
            const clickY =
                (e.touches[0].clientY * doublePendulum.height) / canvas.clientHeight;
            handleMove(clickX, clickY);
        }
      }
    });

    window.addEventListener("mouseup", handleDrop);
    window.addEventListener("touchend", (e) => {
        if (doublePendulum.baseHold || doublePendulum.upperBobHold || doublePendulum.lowerBobHold) {
             handleDrop();
        }
    });

    document.querySelectorAll('.dropdown-content').forEach(dropdown => {
      dropdown.addEventListener("mousedown", (e) => e.stopPropagation());
      dropdown.addEventListener("touchstart", (e) => e.stopPropagation());
    });

    animationToggleButton.addEventListener("click", animationToggle);

    window.addEventListener("keyup", (e) => {
      if (e.key === " " || e.code === "Space") {
        // Prevent space from triggering buttons if a text input is focused
        if (document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') return;
        if (document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'number') return;
        animationToggle();
      }
    });


    function updateTimer() {
      let elapsed;
      if (pauseStart !== null) { 
        elapsed = (pauseStart - startTime) - pausedTime;
      } else { 
        elapsed = (Date.now() - startTime) - pausedTime;
      }

      const totalSeconds = Math.max(0, Math.floor(elapsed / 1000));
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const mill = String(elapsed % 1000).padStart(3, "0");
      const secs = String(totalSeconds % 60).padStart(2, "0");

      runtimeTimer.textContent = `${hrs}hrs, ${mins}min, ${secs}sec ${mill}mill`;
    }

    timerInterval = setInterval(updateTimer, TIMER_UPDATE_INTERVAL);
    
    refresh(); 
    animationToggle(); 
    tracer.setMAX(document.getElementById('persistbox').checked ? TRACE_PERSIST_MAX : TRACE_DEFAULT_MAX);
    togglePendulum(document.getElementById('showPendulumBox').checked);
    document.getElementById('lockLengthBox').checked = lockLengths;
    // Initialize "Pause on Find 2" state
    pauseOnFindEnabled = document.getElementById('pauseOnFindBox').checked;
    if (pauseOnFindEnabled) {
        loadSavedConfig2ForPause();
    }


  </script>
