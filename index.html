<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <style>
      * {
        user-select: none;
      }
      body {
        margin: 0;
        background-color: #121212;
        overflow: hidden;
      }
      svg {
        width: 100%;
        height: 100%;
        background-color: transparent;
        touch-action: none;
      }
      line {
        stroke: white;
        stroke-width: 0.5;
        stroke-linecap: round;
        transition: 0s all;
      }
      circle {
        fill: white;
        stroke: 0;
        cursor: pointer;
      }
      path {
        stroke: white;
        stroke-width: 0.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      #upper_graph {
        stroke: #212121;
      }
      input[type="checkbox"] {
        margin-right: 10px;
        transform: scale(1.5, 1.5);
      }
      
      /* New Menu Styles */
      .menu-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #333;
        z-index: 1000;
        transition: transform 0.3s ease;
      }
      
      .menu-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        min-height: 50px;
      }
      
      .menu-section {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      
      .menu-section.left {
        flex: 0 0 auto;
      }
      
      .menu-section.center {
        flex: 1 1 auto;
        justify-content: center;
      }
      
      .menu-section.right {
        flex: 0 0 auto;
      }
      
      .menu-button {
        background: none;
        border: none;
        color: #909090;
        font-family: "Courier New", Courier, monospace;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      
      .menu-button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .menu-button.active {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .menu-button.primary {
        background-color: #0066cc;
        color: white;
        padding: 8px 16px;
      }
      
      .menu-button.primary:hover {
        background-color: #0052a3;
      }
      
      #pause {
        font-size: 20px;
        padding: 8px 16px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
      }
      
      #pause:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .menu-dropdown {
        position: relative;
        display: inline-block;
      }
      
      .dropdown-content {
        position: absolute;
        top: 100%;
        left: 0;
        background-color: rgba(33, 33, 33, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid #444;
        border-radius: 4px;
        padding: 10px;
        margin-top: 5px;
        display: none;
        min-width: 200px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
      
      .dropdown-content.show {
        display: block;
      }
      
      .dropdown-section {
        margin-bottom: 15px;
      }
      
      .dropdown-section:last-child {
        margin-bottom: 0;
      }
      
      .dropdown-title {
        color: #666;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 5px;
        letter-spacing: 1px;
      }
      
      .dropdown-item {
        display: block;
        padding: 5px 10px;
        color: #909090;
        text-decoration: none;
        border-radius: 3px;
        transition: all 0.2s ease;
        cursor: pointer;
        font-size: 12px;
      }
      
      .dropdown-item:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .dropdown-item label {
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      
      .preset-group {
        display: flex;
        gap: 5px;
        margin: 5px 0;
      }
      
      .preset-button {
        padding: 5px 10px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid #444;
        border-radius: 3px;
        color: #909090;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
      }
      
      .preset-button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .preset-button.active {
        color: white;
        background-color: #0066cc;
        border-color: #0066cc;
      }
      
      .custom-input {
        width: 100%;
        padding: 5px;
        background-color: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 3px;
        font-family: "Courier New", Courier, monospace;
        font-size: 11px;
        margin-top: 5px;
      }
      
      .mass-control {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 5px 0;
      }
      
      .mass-control span {
        color: #909090;
        font-size: 12px;
      }
      
      .mass-control button {
        width: 24px;
        height: 24px;
        border: 1px solid #444;
        background-color: rgba(255, 255, 255, 0.1);
        color: #909090;
        border-radius: 3px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s ease;
      }
      
      .mass-control button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      .save-load-buttons {
        display: flex;
        gap: 5px;
        margin: 5px 0;
      }
      
      .save-load-buttons button {
        flex: 1;
        padding: 5px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid #444;
        border-radius: 3px;
        color: #909090;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
      }
      
      .save-load-buttons button:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      /* Mobile Menu Toggle */
      .mobile-menu-toggle {
        display: none;
        font-size: 24px;
        padding: 5px 10px;
        color: #909090;
        background: none;
        border: none;
        cursor: pointer;
      }
      
      @media only screen and (max-width: 768px) {
        .menu-main {
          padding: 10px;
        }
        
        .menu-section.center {
          display: none;
        }
        
        .menu-section.right {
          display: none;
        }
        
        .mobile-menu-toggle {
          display: block;
        }
        
        .menu-button {
          font-size: 12px;
          padding: 6px 10px;
        }
        
        #pause {
          font-size: 16px;
          padding: 6px 12px;
        }
        
        .dropdown-content {
          position: fixed;
          top: 60px;
          left: 10px;
          right: 10px;
          max-width: none;
        }
      }
      
      /* Keep existing styles for the rest of the elements */
      @media only screen and (min-width: 768px) {
        line {
          stroke-width: 0.3;
        }
        path {
          stroke-width: 0.1;
        }
      }

      #runtime-timer {
        position: fixed;
        bottom: 10px;
        left: 10px;
        font-size: 16pt;
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.1);
        color: #00ffcc;
        padding: 5px 10px;
        border-radius: 5px;
        font-family: monospace;
        z-index: 9999;
      }

      #ticks-counter {
          position: fixed;
          bottom: 40px; 
          left: 10px;
          font-size: 16pt;
          font-weight: bold;
          background-color: rgba(255, 255, 255, 0.1);
          color: #00ccff; 
          padding: 5px 10px;
          border-radius: 5px;
          font-family: monospace;
          z-index: 9999;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="container">
      <path id="upper_graph" />
      <circle id="base" />
      <line id="upper_string" />
      <circle id="upper_bob" />
      <line id="lower_string" />
      <circle id="lower_bob" />
      <path id="tracer" />
    </svg>
    
    <div class="menu-container" id="menuContainer">
      <div class="menu-main">
        <div class="menu-section left">
          <a href="/" class="menu-button">⌂</a>
          <button id="pause" class="menu-button">▶</button>
          <button onclick="loadConfig(1)" class="menu-button">RESET</button>
        </div>
        
        <div class="menu-section center">
          <!-- Simulation Controls -->
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('simulationDropdown')">SIMULATION ▼</button>
            <div id="simulationDropdown" class="dropdown-content">
              <div class="dropdown-section">
                <div class="dropdown-title">Time Step (DT)</div>
                <div class="preset-group">
                  <button class="preset-button" onclick="setDTPreset(0.05, this)">Slow</button>
                  <button class="preset-button active" onclick="setDTPreset(0.1, this)">Normal</button>
                  <button class="preset-button" onclick="setDTPreset(0.2, this)">Fast</button>
                </div>
                <input type="number" class="custom-input" id="dtInput" placeholder="Custom (0.001-1.0)" step="0.001" min="0.001" max="1.0">
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-title">Error Threshold</div>
                <div class="preset-group">
                  <button class="preset-button" onclick="setErrorPreset(0.001, this)">Exact</button>
                  <button class="preset-button active" onclick="setErrorPreset(0.01, this)">Close</button>
                  <button class="preset-button" onclick="setErrorPreset(0.05, this)">Loose</button>
                </div>
                <input type="number" class="custom-input" id="errorPercentageInput" placeholder="Custom (0.0-1.0)" step="0.001" min="0" max="1">
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-item">
                  <label>
                    <input type="checkbox" id="pauseOnFindBox" onchange="pauseOnFindEnabled = this.checked; if (this.checked) loadSavedConfig2ForPause();">
                    Pause on Find 2
                  </label>
                </div>
              </div>
            </div>
          </div>
          
          <!-- Display Options -->
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('displayDropdown')">DISPLAY ▼</button>
            <div id="displayDropdown" class="dropdown-content">
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="showPendulumBox" onchange="togglePendulum(this.checked)">
                  Show Pendulum
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="resetbox" onchange="tracer.setActive(this.checked)">
                  Show Trace
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="graphbox" onchange="upperGraph.setActive(this.checked)">
                  Show Graph
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" id="persistbox" onchange="tracer.setMAX(this.checked ? 10000 : 500)">
                  Persist Trace
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" id="smoothenbox" onchange="tracer.smoothen=this.checked">
                  Smoothen Trace
                </label>
              </div>
            </div>
          </div>
          
          <!-- Physics Options -->
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('physicsDropdown')">PHYSICS ▼</button>
            <div id="physicsDropdown" class="dropdown-content">
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="gravitybox" onchange="doublePendulum.setGravity(this.checked ? 0.1 : 0)">
                  Gravity
                </label>
              </div>
              <div class="dropdown-item">
                <label>
                  <input type="checkbox" checked id="lockLengthBox" onchange="lockLengths = this.checked">
                  Lock Rope Lengths
                </label>
              </div>
              
              <div class="dropdown-section">
                <div class="dropdown-title">Mass Controls</div>
                <div class="mass-control">
                  <button onclick="doublePendulum.decreaseUpperMass()">-</button>
                  <span>Upper Mass</span>
                  <button onclick="doublePendulum.increaseUpperMass()">+</button>
                </div>
                <div class="mass-control">
                  <button onclick="doublePendulum.decreaseLowerMass()">-</button>
                  <span>Lower Mass</span>
                  <button onclick="doublePendulum.increaseLowerMass()">+</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="menu-section right">
          <button onclick="shareConfig()" class="menu-button">SHARE</button>
          <div class="menu-dropdown">
            <button class="menu-button" onclick="toggleDropdown('saveDropdown')">SAVE/LOAD ▼</button>
            <div id="saveDropdown" class="dropdown-content">
              <div class="dropdown-section">
                <div class="dropdown-title">Slot 1</div>
                <div class="save-load-buttons">
                  <button onclick="saveConfig(1)">💾 Save</button>
                  <button onclick="loadConfig(1)">📂 Load</button>
                </div>
              </div>
              <div class="dropdown-section">
                <div class="dropdown-title">Slot 2</div>
                <div class="save-load-buttons">
                  <button onclick="saveConfig(2)">💾 Save</button>
                  <button onclick="loadConfig(2)">📂 Load</button>
                </div>
              </div>
            </div>
          </div>
          <a href="https://github.com/theabbie/DoublePendulum" class="menu-button">GITHUB</a>
        </div>
        
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>
    
    <div id="runtime-timer">00hrs, 00min, 00sec 0mill</div>
    <div id="ticks-counter">Ticks: 0</div>
  </body>
  <script>
    // Menu functionality
    function toggleDropdown(dropdownId) {
      const dropdown = document.getElementById(dropdownId);
      const allDropdowns = document.querySelectorAll('.dropdown-content');
      
      allDropdowns.forEach(d => {
        if (d !== dropdown) {
          d.classList.remove('show');
        }
      });
      
      dropdown.classList.toggle('show');
    }
    
    function toggleMobileMenu() {
      const centerSection = document.querySelector('.menu-section.center');
      const rightSection = document.querySelector('.menu-section.right');
      
      if (centerSection.style.display === 'none' || !centerSection.style.display) {
        centerSection.style.display = 'flex';
        rightSection.style.display = 'flex';
      } else {
        centerSection.style.display = 'none';
        rightSection.style.display = 'none';
      }
    }
    
    // Close dropdowns when clicking outside
    window.addEventListener('click', function(e) {
      if (!e.target.matches('.menu-button') && !e.target.closest('.dropdown-content')) {
        const dropdowns = document.querySelectorAll('.dropdown-content');
        dropdowns.forEach(d => d.classList.remove('show'));
      }
    });
    
    // DT Preset handlers
    function setDTPreset(value, button) {
      // Remove active class from all preset buttons in this group
      button.parentElement.querySelectorAll('.preset-button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      
      // Set the value
      doublePendulum.dt = value;
      document.getElementById('dtInput').value = value.toFixed(5);
    }
    
    // Error Preset handlers
    function setErrorPreset(value, button) {
      // Remove active class from all preset buttons in this group
      button.parentElement.querySelectorAll('.preset-button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      
      // Set the value
      acceptableErrorPercentage = value;
      document.getElementById('errorPercentageInput').value = value.toFixed(3);
    }
    
    // Original code starts here with modifications
    const shareButton = document.querySelector("#share");
    const gravityButton = document.querySelector("#gravitybox");
    const animationToggleButton = document.querySelector("#pause");
    const canvas = document.querySelector("#container");
    const upperGraphLine = document.querySelector("#upper_graph");
    const base = document.querySelector("#base");
    const upperString = document.querySelector("#upper_string");
    const lowerString = document.querySelector("#lower_string");
    const upperBob = document.querySelector("#upper_bob");
    const lowerBob = document.querySelector("#lower_bob");
    const tracerLine = document.querySelector("#tracer");
    const pauseOnFindCheckbox = document.getElementById("pauseOnFindBox"); 
    const ticksCounter = document.getElementById("ticks-counter"); 

    // New input element references
    const dtInput = document.getElementById("dtInput");
    const errorPercentageInput = document.getElementById("errorPercentageInput");

    let totalTicks = 0; 
    let animation;
    let lockLengths = true;
    let pauseOnFindEnabled = false; 
    let savedPendulumState2 = null; 
    let acceptableErrorPercentage = 0.01; // Now 'let', default value
    let startTime = Date.now();
    let pausedTime = 0;
    let pauseStart = Date.now(); 

    class DoublePendulum {
      constructor({
        width,
        height,
        x0,
        y0,
        ang0,
        ang1,
        v0,
        v1,
        acc0,
        acc1,
        baseRad,
        l0,
        l1,
        r0,
        r1,
        m0,
        m1,
        g,
        massScaleFactor,
        speedScaleFactor,
        dt, // dt is still part of constructor for initial setup
        fps,
      }) {
        this.width = width;
        this.height = height;
        this.x0 = x0;
        this.y0 = y0;
        this.ang0 = ang0;
        this.ang1 = ang1;
        this.v0 = v0;
        this.v1 = v1;
        this.acc0 = acc0;
        this.acc1 = acc1;
        this.baseRad = baseRad;
        this.l0 = l0;
        this.l1 = l1;
        this.r0 = r0;
        this.r1 = r1;
        this.m0 = m0;
        this.m1 = m1;
        this.g = g;
        this.upperBobHold = false;
        this.lowerBobHold = false;
        this.baseHold = false;
        this.massScaleFactor = massScaleFactor;
        this.speedScaleFactor = speedScaleFactor;
        this.dt = dt; // This will be controlled by the input field after initialization
        this.fps = fps;
        this.setMoments();
      }

      setWidth(w) {
        this.width = w;
      }

      setHeight(h) {
        this.height = h;
      }

      setUpperAngle(ang) {
        this.ang0 = ang;
      }

      setLowerAngle(ang) {
        this.ang1 = ang;
      }

      setUpperVelocity(vel) {
        this.v0 = vel;
      }

      setLowerVelocity(vel) {
        this.v1 = vel;
      }

      setUpperAcceleration(acc) {
        this.acc0 = acc;
      }

      setLowerAcceleration(acc) {
        this.acc1 = acc;
      }

      increaseSpeed() {
        this.dt *= this.speedScaleFactor;
        const dtInputField = document.getElementById('dtInput');
        if (dtInputField) {
            dtInputField.value = this.dt.toFixed(5); 
        }
      }

      decreaseSpeed() {
        this.dt /= this.speedScaleFactor;
        const dtInputField = document.getElementById('dtInput');
        if (dtInputField) {
            dtInputField.value = this.dt.toFixed(5);
        }
      }

      increaseUpperMass() {
        this.m0 *= this.massScaleFactor;
      }

      decreaseUpperMass() {
        this.m0 /= this.massScaleFactor;
      }

      increaseLowerMass() {
        this.m1 *= this.massScaleFactor;
      }

      decreaseLowerMass() {
        this.m1 /= this.massScaleFactor;
      }

      setGravity(gravity) {
        this.g = gravity;
      }

      setMoments() {
        const { m0, m1, ang0, ang1, l0, l1, v0, v1 } = this;
        const commonVal = m1 * l0 * l1 * Math.cos(ang0 - ang1);
        this.moment0 = (m0 + m1) * l0 ** 2 * v0 + v1 * commonVal;
        this.moment1 = m1 * l1 ** 2 * v1 + v0 * commonVal;
      }

      setBasePos(x, y) {
        const upperBob = this.getUpperBob();
        const [distX, distY] = [upperBob.x - x, upperBob.y - y];
        this.x0 = x;
        this.y0 = y;
        this.l0 = Math.sqrt(distX ** 2 + distY ** 2);
        this.ang0 = Math.atan2(distX, distY);
      }

      setUpperBobPos(x, y) {
        const [distX, distY] = [x - this.x0, y - this.y0];
        if (lockLengths) {
          const angle = Math.atan2(distX, distY);
          this.ang0 = angle;
        } else {
          this.l0 = Math.sqrt(distX ** 2 + distY ** 2);
          this.ang0 = Math.atan2(distX, distY);
        }
      }

      setLowerBobPos(x, y) {
        const upperBobPos = this.getUpperBob();
        const [distX, distY] = [x - upperBobPos.x, y - upperBobPos.y];
        if (lockLengths) {
          const angle = -Math.atan2(distX, distY); // Note: angle calculation might need review based on coordinate system for l1
          this.ang1 = angle;
        } else {
          this.l1 = Math.sqrt(distX ** 2 + distY ** 2);
          this.ang1 = -Math.atan2(distX, distY); // Note: angle calculation might need review
        }
      }

      holdBase() {
        this.baseHold = true;
      }

      holdUpperBob() {
        this.upperBobHold = true;
      }

      holdLowerBob() {
        this.lowerBobHold = true;
      }

      dropBase() {
        this.baseHold = false;
      }

      dropUpperBob() {
        this.upperBobHold = false;
      }

      dropLowerBob() {
        this.lowerBobHold = false;
      }

      calculateBobPosition(x0, y0, angle, len) {
        const offsetX = len * Math.sin(angle);
        const offsetY = len * Math.cos(angle);
        const x = x0 + offsetX;
        const y = y0 + offsetY;
        return { x, y };
      }

      getUpperBob() {
        const { x0, y0, ang0, l0 } = this;
        const { x, y } = this.calculateBobPosition(x0, y0, ang0, l0);
        return { x, y };
      }

      getLowerBob() {
        const upperBobPos = this.getUpperBob();
        const { ang1, l1 } = this;
        const { x, y } = this.calculateBobPosition(
          upperBobPos.x,
          upperBobPos.y,
          -ang1, // Using -ang1 based on typical double pendulum equations
          l1
        );
        return { x, y };
      }

      // getAngularVelocities method (Hamiltonian approach doesn't directly use accelerations this way)
      // This method might be from a previous Lagrangian implementation and can be removed if Hamiltonian is solely used for stepping.
      // For now, it's kept but not directly used by the move() method if it's purely Hamiltonian.
      getAngularVelocities() {
        // ... (original implementation, potentially unused if move() is purely Hamiltonian)
      }
      
      hamiltonian(ang0, ang1, moment0, moment1) {
        const { m0, m1, l0, l1, g } = this;
        const C0 = l0 * l1 * (m0 + m1 * Math.sin(ang0 - ang1) ** 2);
        // Prevent division by zero if C0 is too small (e.g., if l0 or l1 is zero, or angles align perfectly)
        if (Math.abs(C0) < 1e-9) { 
            return [0,0,0,0]; // Or handle appropriately, e.g., by returning previous velocities/momenta derivatives
        }
        const C1 = (moment0 * moment1 * Math.sin(ang0 - ang1)) / C0;
        const C2 =
          ((m1 * (l1 * moment0) ** 2 +
            (m0 + m1) * (l0 * moment1) ** 2 -
            2 * l0 * l1 * m1 * moment0 * moment1 * Math.cos(ang0 - ang1)) *
            Math.sin(2 * (ang0 - ang1))) /
          (2 * C0 ** 2);
        const F_ang0 =
          (l1 * moment0 - l0 * moment1 * Math.cos(ang0 - ang1)) / (l0 * C0);
        const F_ang1 =
          (l0 * (m0 + m1) * moment1 -
            l1 * m1 * moment0 * Math.cos(ang0 - ang1)) /
          (l1 * m1 * C0);
        const F_moment0 = -(m0 + m1) * g * l0 * Math.sin(ang0) - C1 + C2;
        const F_moment1 = -m1 * g * l1 * Math.sin(ang1) + C1 - C2;
        return [F_ang0, F_ang1, F_moment0, F_moment1];
      }

      move() {
        // dt is now taken from this.dt, which is updated by the input field
        const { ang0, ang1, moment0, moment1, dt } = this; 
        const curr = [ang0, ang1, moment0, moment1];
        const k1 = this.hamiltonian(...curr);
        const k2 = this.hamiltonian(
          ...curr.map((_c, _i) => _c + 0.5 * dt * k1[_i])
        );
        const k3 = this.hamiltonian(
          ...curr.map((_c, _i) => _c + 0.5 * dt * k2[_i])
        );
        const k4 = this.hamiltonian(...curr.map((_c, _i) => _c + dt * k3[_i]));
        const R = [0, 0, 0, 0].map(
          (_c, _i) => (dt * (k1[_i] + 2 * k2[_i] + 2 * k3[_i] + k4[_i])) / 6
        );
        this.ang0 += R[0];
        this.ang1 += R[1];
        this.moment0 += R[2];
        this.moment1 += R[3];
        this.ang0 = ((3 * Math.PI + this.ang0) % (2 * Math.PI)) - Math.PI;
        this.ang1 = ((3 * Math.PI + this.ang1) % (2 * Math.PI)) - Math.PI;
      }
    }

    class Tracer {
      constructor() {
        this.points = [];
        this.MAX = 500;
        this.isActive = true;
        this.ctr = 0;
        this.smooth = 0.2;
        this.smoothen = false;
      }

      addPoint({ x, y }) {
        if (this.isActive)
          this.points = [...this.points.slice(-this.MAX), { x, y }];
        else this.points = [];
      }

      addGraphPoint(data) {
        if (this.isActive)
          this.points = [...this.points, { x: this.ctr++, y: data }];
        else this.points = [];
      }

      clearPoints() {
        this.points = [];
        this.ctr = 0;
      }

      getLine(p1, p2) {
        const distX = p2.x - p1.x;
        const distY = p2.y - p1.y;
        const len = Math.sqrt(distX ** 2 + distY ** 2);
        const ang = Math.atan2(distY, distX);
        return { len, ang };
      }

      getControlPoint(current, previous, next, reverse) {
        previous = previous || current;
        next = next || current;
        let { len, ang } = this.getLine(previous, next);
        ang = ang + (reverse ? Math.PI : 0);
        len = len * this.smooth;
        const x = current.x + len * Math.cos(ang);
        const y = current.y + len * Math.sin(ang);
        return { x, y };
      }

      getSmoothPoint(point, i, points) {
        const prevSmooth = this.getControlPoint(
          points[i - 1],
          points[i - 2],
          point
        );
        const nextSmooth = this.getControlPoint(
          point,
          points[i - 1],
          points[i + 1]
        );
        return `C${prevSmooth.x.toFixed(2)} ${prevSmooth.y.toFixed(
          2
        )} ${nextSmooth.x.toFixed(2)} ${nextSmooth.y.toFixed(
          2
        )} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`;
      }

      getPointsAsString() {
        if (this.points.length === 0) return "";
        if (this.smoothen) {
          return this.points
            .map(
              ({ x, y }, i) =>
                `${
                  i == 0
                    ? `M${x.toFixed(2)} ${y.toFixed(2)}`
                    : this.getSmoothPoint({ x, y }, i, this.points)
                }`
            )
            .join(" ");
        } else {
          return this.points
            .map(
              ({ x, y }, i) =>
                `${i == 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`
            )
            .join(" ");
        }
      }

      setActive(active) {
        this.isActive = active;
      }

      setMAX(n) {
        this.MAX = n;
      }
    }

    function getDistance(p1, p2) {

    function checkPauseOnFind() {
      if (!pauseOnFindEnabled || !savedPendulumState2) {
        return;

      const currentUpperBobPos = doublePendulum.getUpperBob();
      const currentLowerBobPos = doublePendulum.getLowerBob();
      
      // Create a temporary pendulum from saved state for comparison
      // Ensure savedPendulumState2 has all necessary properties for constructor
      const tempDefaultState = { // Provide defaults for any missing properties
        width: doublePendulum.width, height: doublePendulum.height, x0:0,y0:0,ang0:0,ang1:0,v0:0,v1:0,acc0:0,acc1:0,
        baseRad:0,l0:1,l1:1,r0:1,r1:1,m0:1,m1:1,g:0.1,massScaleFactor:1.2,speedScaleFactor:1.2,dt:0.1,fps:100
      };
      const stateForComparison = { ...tempDefaultState, ...savedPendulumState2, width: doublePendulum.width, height: doublePendulum.height };


      const dummyPendulum = new DoublePendulum(stateForComparison);
      const savedUpperBobPos = dummyPendulum.getUpperBob();
      const savedLowerBobPos = dummyPendulum.getLowerBob();

      const errorThreshold = doublePendulum.l0 * acceptableErrorPercentage; // Use global variable

      const distUpper = getDistance(currentUpperBobPos, savedUpperBobPos);
      const distLower = getDistance(currentLowerBobPos, savedLowerBobPos);

      if (distUpper <= errorThreshold && distLower <= errorThreshold) {
        if (animation) { 
            animationToggle();
            console.log("PAUSED: Pendulum found Save 2 position!");
        }
      }
    }

    function handleHold(clickX, clickY) {
      const { x0, y0, baseRad, r0, r1 } = doublePendulum;
      const upperBob = doublePendulum.getUpperBob();
      const lowerBob = doublePendulum.getLowerBob();
      if ((clickX - x0) ** 2 + (clickY - y0) ** 2 < 2.25 * baseRad ** 2) {
        tracer.clearPoints();
        doublePendulum.holdBase();
        totalTicks = 0; 
        ticksCounter.innerText = `Ticks: ${totalTicks}`;
      }
      if (
        (clickX - upperBob.x) ** 2 + (clickY - upperBob.y) ** 2 <
        2.25 * r0 ** 2
      ) {
        if (animation) animationToggle(); // Pause before holding
        tracer.clearPoints();
        doublePendulum.holdUpperBob();
        totalTicks = 0; 
        ticksCounter.innerText = `Ticks: ${totalTicks}`;
      }
      if (
        (clickX - lowerBob.x) ** 2 + (clickY - lowerBob.y) ** 2 <
        2.25 * r1 ** 2
      ) {

        tracer.clearPoints();
        doublePendulum.holdLowerBob();
        totalTicks = 0; 
        ticksCounter.innerText = `Ticks: ${totalTicks}`;
      }
    }

        }
        if (doublePendulum.upperBobHold) {
            doublePendulum.setUpperBobPos(clickX, clickY);

        if (doublePendulum.lowerBobHold) {
            doublePendulum.setLowerBobPos(clickX, clickY);
        }
        drawPendulum(); // Redraw while dragging
      }
    }

      // If it was running and then held, it's now paused.

      if (!animation && (doublePendulum.upperBobHold || doublePendulum.lowerBobHold || doublePendulum.baseHold )) {
         // Ensure pauseStart is set if it was running before hold
         if(pauseStart === null) pauseStart = Date.now();

    function updateTimer() {
      let elapsed;
      if (pauseStart !== null) { // Paused
        elapsed = (pauseStart - startTime) - pausedTime;
      } else { // Running
        elapsed = (Date.now() - startTime) - pausedTime;
      }

      const totalSeconds = Math.max(0,Math.floor(elapsed / 1000));
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(
        2,
        "0"
      );
      const mill = String(elapsed % 1000).padStart(3, "0"); // Milliseconds
      const secs = String(totalSeconds % 60).padStart(2, "0");

      document.getElementById("runtime-timer").innerText =
        `${hrs}hrs, ${mins}min, ${secs}sec ${mill}mill`;
    }

    setInterval(updateTimer, 50); // Update timer more frequently for smoother ms
    
    // Initial setup
    refresh(); // Initialize pendulum and inputs
    animationToggle(); // Start paused
    tracer.setMAX(document.getElementById('persistbox').checked ? 10000 : 500); // Initial persist trace
    togglePendulum(document.getElementById('showPendulumBox').checked); // Initial show pendulum
    document.getElementById('lockLengthBox').checked = lockLengths; // Initial lock lengths

  </script>
</html>
